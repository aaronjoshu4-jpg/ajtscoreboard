<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>AJT Tennis Club — Halloween Party</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(60% 50% at 20% 10%,#6a28a8,#1a0634 70%);color:#fff;font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;padding:20px}
.b{max-width:380px;width:100%;text-align:center}.s{letter-spacing:.3em;font-weight:800;font-size:12px}.t{font-family:Impact,"Bebas Neue","Arial Narrow",sans-serif;font-size:46px;line-height:.95;text-shadow:3px 3px 0 #000;margin:4px 0 18px}
input{width:100%;box-sizing:border-box;font:inherit;font-size:22px;text-align:center;letter-spacing:.2em;padding:12px;border-radius:10px;border:3px solid #6a28a8;background:#0e0420;color:#fff}input:focus{outline:none;border-color:#ff7a14}
button{margin-top:12px;width:100%;font:inherit;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:18px;padding:12px;border:0;border-radius:10px;background:#ff7a14;color:#1b0a00;box-shadow:0 4px 0 #000;cursor:pointer}
.m{color:#ff9fb1;min-height:1.4em;margin-top:10px;font-weight:700}</style></head><body><form class="b" id="f"><div class="s">AJT TENNIS CLUB</div><div class="t">HALLOWEEN PARTY</div>
<input id="c" type="password" autocomplete="off" placeholder="ACCESS CODE" autofocus><button>Enter</button><div class="m" id="m"></div></form>
<script>
document.getElementById('f').addEventListener('submit',async function(e){e.preventDefault();var m=document.getElementById('m');m.textContent='';
try{var r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:document.getElementById('c').value})});var j=await r.json();
if(j.ok){var n=new URLSearchParams(location.search).get('next')||'/live';if(n.charAt(0)!=='/'||n.charAt(1)==='/')n='/live';location.href=n;}else m.textContent=j.error||'That code is not right.';}catch(x){m.textContent='No connection. Try again.';}});
</script></body></html>
